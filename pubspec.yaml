name: dio_network_toolkit
description: >-
  Production-ready network layer for Flutter & Dart with auth refresh,
  smart retry, offline queue, response cache, deduplication, and upload
  progress using sealed Result types.
version: 1.0.3
homepage: https://github.com/sagars-sachdev98/dio-network-toolkit
repository: https://github.com/sagars-sachdev98/dio-network-toolkit
issue_tracker: https://github.com/sagars-sachdev98/dio-network-toolkit/issues
topics:
  - dio
  - networking
  - http-client
  - clean-architecture
  - api

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  dio: ^5.5.0
  connectivity_plus: ^7.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  http_mock_adapter: ^0.6.1
  connectivity_plus_platform_interface: ^2.0.0
